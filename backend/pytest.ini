[pytest]
# Por defecto ejecuta SOLO los tests unitarios rápidos del motor y del score
# (deterministas, sin red). Son el "botón rojo/verde" para ejecutar cada vez
# que se toca la lógica de niveles o de puntuación.
#
#   pytest                         -> tests unitarios (rápido, sin red)
#   pytest tests/backend_test.py   -> tests de integración (necesitan servidor en vivo)
#
addopts = -q --ignore=tests/backend_test.py
testpaths = tests
