<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#1a3a32" />
        <meta name="description" content="InverIA · Análisis bursátil en tiempo real con alertas inteligentes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="InverIA" />
        <!-- Iconos. El SVG es el que usan los navegadores modernos (escala sin pixelarse);
             el .ico queda de respaldo para los que no soportan SVG. Sin esto la pestaña
             salía con el icono genérico de "página sin favicon". -->
        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="16x16 32x32 48x48" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="preconnect" href="https://inveria-backend.onrender.com" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
        <title>InverIA · Análisis Bursátil</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <!-- Tema ANTES del primer pintado. React monta unos cientos de milisegundos
             después de que el navegador pinte, así que decidirlo solo en React deja un
             destello blanco a pantalla completa al abrir la app. Con el oscuro como
             tema por defecto ese destello se ve en cada carga, y es de las cosas que
             más barato se arreglan y más caro se notan. Mismo criterio que App.js:
             solo se arranca en claro si el usuario lo eligió alguna vez. -->
        <script>(function(){try{var g=localStorage.getItem("inveria-dark");if(g===null||g==="1"){document.documentElement.classList.add("dark")}}catch(e){document.documentElement.classList.add("dark")}})();</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
