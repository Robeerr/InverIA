<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0e0f14" />
        <meta name="description" content="InverIA · Análisis bursátil en tiempo real con alertas inteligentes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="InverIA" />
        <!-- Iconos. El SVG es el que usan los navegadores modernos (escala sin pixelarse);
             el .ico queda de respaldo para los que no soportan SVG. Sin esto la pestaña
             salía con el icono genérico de "página sin favicon". -->
        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="16x16 32x32 48x48" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="preconnect" href="https://inveria-backend.onrender.com" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Geist para la interfaz, titulares y cifra héroe; Geist Mono para las
             columnas de cifras (tabulares). Ejes variables: un solo archivo por familia. -->
        <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
        <title>InverIA · Análisis Bursátil</title>
        <!-- Arranque (tema antes del primer pintado y un aviso falso del navegador). Va en
             un archivo y no en línea para que la CSP pueda prohibir los scripts en línea. -->
        <script src="%PUBLIC_URL%/inicio.js"></script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
