name: Keep Render backend warm

# Pings the backend every 10 minutes so Render's free tier doesn't suspend it.
# This keeps the alerts worker running 24/7, so price alerts get delivered even
# when no user is browsing the app.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:           # also allow manual run from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" https://inveria-backend.onrender.com/api/health)
          echo "HTTP $STATUS"
          cat /tmp/resp.json || true
          # Don't fail the workflow on Render cold-start hiccups (it'll wake up next run)
          exit 0
