name: Keep Render backend warm

# Pings the backend every 5 minutes so Render's free tier never suspends it.
# This keeps the alerts worker running 24/7 and eliminates cold-start delays.

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:         # allow manual run from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 30 https://inveria-backend.onrender.com/api/health)
          echo "HTTP $STATUS"
          cat /tmp/resp.json || true
          exit 0
